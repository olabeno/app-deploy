name: "IAC & APP"

on:
  push:
    branches:
      - main
      - dev-branch
    paths:
      - IAC/**
      - app/**
  pull_request:
    branches:
      - main
    paths:
      - IAC/**
      - app/**


jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
      AWS_REGION: us-east-1
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform with S3 Backend
        id: tf-init
        run: terraform init -backend-config="bucket=${{env.BUCKET_TF_STATE}}" -backend-config=${{ env.AWS_REGION }} 
        working-directory: IAC 

      - name: Validate Terraform Configuration
        run: terraform validate
        working-directory: IAC 

      - name: Generate Terraform Plan
        id: tfplan
        if: steps.tf-init.outcome == 'success'
        run: terraform plan -no-color -input=false -out=tf-paln
        working-directory: IAC 

