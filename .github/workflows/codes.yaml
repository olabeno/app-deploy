name: IAC & APP Deployment and Cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev-branch
    paths:
      - IAC/**
      - app/**
      - k8s/**
  pull_request:
    branches:
      - main
    paths:
      - IAC/**
      - app/**
      - k8s/**
  
jobs:
  # job-1
  terraform-construct:      
    name: Terraform Deployment
    runs-on: ubuntu-latest

    env:
      #BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
      AWS_REGION: us-east-1
      #KUBECONFIG: ~/.kube/
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform with S3 Backend
        id: tf-init
        run: terraform init   
        working-directory: IAC 

      - name: Validate Terraform Configuration
        run: terraform validate
        working-directory: IAC 

      - name: Generate Terraform Plan
        id: tfplan
        if: steps.tf-init.outcome == 'success'
        run: terraform plan -no-color -input=false -out=tf-plan
        working-directory: IAC
        
      - name: Apply Terraform Configuration
        id: tfapply
        if: steps.tfplan.outcome == 'success'
        run: terraform apply -auto-approve tf-plan
        working-directory: IAC

      - name: Get microk8s EC2 IP address
        id: kube-cluster-ip
        run: |
          echo $(terraform output -raw ec2_public_ip) > EC2_HOST
          echo $EC2_HOST
  # Job-2      
  Build-publish-app:
    name: App builder and publisher
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: r3z5w8y3/dprofileapp  # Change to your AWS Public ECR alias
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Docker login
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: env.AWS_REGION

      - name: Build image
        run: |
          docker build -t dprofileapp .
          docker tag dprofileapp:latest ${{ secrets.REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ secrets.REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          
        

